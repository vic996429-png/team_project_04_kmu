<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>처리 상태 · 성북 안심 민원 필터</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/status.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="/"><span class="brand__mark" aria-hidden="true">성북</span>안심 민원 필터 <small>시제품</small></a>
      <nav class="nav" aria-label="화면 이동">
        <a href="/">민원 쓰기</a>
        <a href="/status" aria-current="page">처리 상태</a>
        <a href="/officer">담당자 현황판</a>
        <a href="/admin">관리·감독</a>
      </nav>
    </div>
  </header>

  <main class="page status">
    <div class="page-head">
      <h1>처리 상태 보기</h1>
      <p>접수할 때 받은 접수번호로 처리 상태를 확인합니다.</p>
    </div>

    <section class="card card--accent">
      <form id="lookup" class="lookup" novalidate>
        <div class="field" style="margin:0">
          <label for="rid">접수번호</label>
          <input class="input" id="rid" name="rid" placeholder="예: SB-20261119-001" autocomplete="off" aria-describedby="rid-help rid-err">
          <div class="help"><span id="rid-help">이 시제품은 민원을 쓴 같은 브라우저에서만 조회됩니다.</span></div>
          <span class="err" id="rid-err" role="alert"></span>
        </div>
        <button class="btn btn--brand" type="submit">조회</button>
      </form>
    </section>

    <section class="card" id="result" hidden aria-labelledby="result-title" tabindex="-1"></section>

    <div class="callout callout--neutral" style="margin-top:12px">
      <p class="small">실제 도입 때는 누리집 실명 확인(로그인) 정보로 처리 결과를 회신하는 방식을 성북구 기존 절차와 맞춰야 합니다. [확인 필요]</p>
    </div>
  </main>

  <script type="module" src="/assets/status.js"></script>
</body>
</html>
