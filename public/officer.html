<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>담당자 현황판 · 성북 안심 민원 필터</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/officer.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner wide">
      <a class="brand" href="/"><span class="brand__mark" aria-hidden="true">성북</span>안심 민원 필터 <small>시제품</small></a>
      <nav class="nav" aria-label="화면 이동">
        <a href="/">민원 쓰기</a>
        <a href="/status">처리 상태</a>
        <a href="/officer" aria-current="page">담당자 현황판</a>
        <a href="/admin">관리·감독</a>
      </nav>
    </div>
  </header>

  <main class="page wide">
    <div class="page-head page-head--work row">
      <div>
        <h1>담당자 현황판</h1>
        <p>AI는 단계를 표시하고 제안만 합니다. 단계는 담당자가 확정합니다.</p>
      </div>
      <div class="spacer"></div>
      <div id="manual-flag" hidden class="badge badge--review">AI 표시 일시 중지 중</div>
    </div>

    <div class="board">
      <section class="board__list card" aria-label="민원 목록">
        <div class="seg" role="tablist" id="tabs"></div>
        <ul class="list" id="list" role="listbox" aria-label="민원"></ul>
      </section>

      <section class="board__detail card card--accent" id="detail" aria-live="polite">
        <p class="muted">왼쪽 목록에서 민원을 고르세요.</p>
      </section>

      <aside class="board__rules card" aria-labelledby="rules-title">
        <h2 id="rules-title">관련 규정</h2>
        <p class="small muted">국가법령정보센터·국민참여입법센터에서 불러옵니다. 불러오지 못하면 이유와 「시연 값」을 함께 보여 줍니다.</p>
        <div id="laws"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
        <h3 class="rules__sub">진행 중인 입법예고 <span class="small muted">(검색어: 민원)</span></h3>
        <div id="lawmaking"><div class="skel"></div></div>
        <h3 class="rules__sub">참고 자료 <span class="small muted">(법령 아님 · 조회 API 없음)</span></h3>
        <div id="refs"><div class="skel"></div></div>
      </aside>
    </div>
  </main>

  <script type="module" src="/assets/officer.js"></script>
</body>
</html>
